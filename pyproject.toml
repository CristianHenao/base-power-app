[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "porchlight-pipeline"
version = "0.1.0"
description = "Offline outage models for Porchlight"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "scipy>=1.13",
    "shapely>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
