# What Base offers in each utility area. Hand-built from Base's pricing page.
# No prices here on purpose: Base says availability, pricing and offers vary by
# address, so the app links to `url` for anything beyond the offer type.
#
# offer:
#   energy_plus_backup  Base can be the retail electric provider and install a Core
#   energy_only         Base sells electricity plans only (competitive area, no Core offer)
#   backup_only         Core through a utility or co-op program; the utility still sells the power
#   none                no Base offer listed (any utility not in this file)
#
# eia_utility_id is filled from EIA-861 in ticket A6.

source: https://www.basepowercompany.com/pricing
as_of: 2026-09-26
note: Availability varies by address inside a utility area. Always let the user confirm.

utilities:
  - key: centerpoint
    name: CenterPoint Energy
    region: Greater Houston
    state: TX
    market: ERCOT competitive
    offer: energy_plus_backup
    also: [energy_only]
    url: https://www.basepowercompany.com/centerpoint#pricing

  - key: oncor
    name: Oncor
    region: Central & North Texas
    state: TX
    market: ERCOT competitive
    offer: energy_plus_backup
