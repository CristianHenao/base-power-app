# Local orchestration. Postgres password is a local default only.
name: base-power

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Same check Supabase uses for its local Postgres.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI service (api/app/main.py). XAI_API_KEY comes from the gitignored .env; without it the
  # narrator uses its template and the report says so.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "4000"
      PORCHLIGHT_CORS_ORIGINS: http://localhost:3000
      PORCHLIGHT_DEBUG: ${PORCHLIGHT_DEBUG:-0}
    env_file:
      - path: .env
        required: false
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    image: base-power-stub
    build: ./services/stub
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      SERVICE_NAME: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_MAPBOX_ACCESS_TOKEN: ${NEXT_MAPBOX_ACCESS_TOKEN:-}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env.local
        required: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
